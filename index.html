<!DOCTYPE html>
<html lang="en">
<head>

@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap');
</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Exemplo</title>

        <img src="img/logo.png" class="img-fluid w-25 me-5">

    <nav class="nav container-fluid justify-content-end">

            <li class="nav-item">

            </li>
            <li class="nav-item">

            <li class="nav-item">

        </ul>

    <section class="container m-5">

        <div class="card w-25 text-center p-2 align-items-center text-white">

        </div>
        <div class="card w-25 text-center p-2 align-items-center text-white">

        </div>
        <div class="card w-25 text-center p-2 align-items-center text-white">

                <div class="d-flex justify-content-center">

        </div>
